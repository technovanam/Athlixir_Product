services:
  nginx:
    image: 'nginx:alpine'
    container_name: athlixir-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
      - ai-engine
    restart: always

  redis:
    image: 'redis:alpine'
    container_name: athlixir-redis
    ports:
      - '6379:6379'
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    image: ${DOCKER_USERNAME:-bavithran777}/athlixir-ai-engine:${IMAGE_TAG:-latest}
    container_name: athlixir-ai-engine
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-athlixir-internal-secret-dev-key}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=http://server:3001
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://${PUBLIC_HOST:-localhost}:3000,http://${PUBLIC_HOST:-localhost}
    restart: always
    depends_on:
      redis:
        condition: service_healthy

  server:
    image: ${DOCKER_USERNAME:-bavithran777}/athlixir-server:${IMAGE_TAG:-latest}
    container_name: athlixir-server
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FASTAPI_URL=http://ai-engine:8000/api/analyze
      - FASTAPI_INTEL_URL=http://ai-engine:8000/api/analyze/intelligence
      - FASTAPI_PUBLIC_URL=http://${PUBLIC_HOST:-localhost}:8000
      - FRONTEND_URL=http://localhost:3000,http://${PUBLIC_HOST:-localhost}:3000,http://${PUBLIC_HOST:-localhost},https://${PUBLIC_HOST:-localhost}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-athlixir-internal-secret-dev-key}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-haiku-4-5}
    depends_on:
      - ai-engine
      - redis
    restart: always

  client:
    image: ${DOCKER_USERNAME:-bavithran777}/athlixir-client:${IMAGE_TAG:-latest}
    container_name: athlixir-client
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - server
    restart: always
